<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kezam Store - Painel Administrativo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background: #f1f5f9; color: #1e293b; }
    header { background: #1e1b4b; color: white; padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 22px; }
    .nav-links a { color: #c7d2fe; text-decoration: none; margin-left: 20px; font-weight: 600; font-size: 14px; }
    .nav-links a:hover { color: white; }
    .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
    .tabs { display: flex; gap: 12px; margin-bottom: 24px; }
    .tab-btn { padding: 12px 24px; border: none; border-radius: 8px; background: #e2e8f0; color: #475569; font-weight: bold; cursor: pointer; font-size: 14px; }
    .tab-btn.active { background: #4f46e5; color: white; }
    .section { display: none; }
    .section.active { display: block; }
    .card { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 16px; }
    .order-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; border-bottom: 1px solid #e2e8f0; padding-bottom: 12px; margin-bottom: 12px; }
    .order-id { font-size: 18px; font-weight: bold; color: #4f46e5; }
    .status-badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; text-transform: uppercase; }
    .status-PENDENTE { background: #fef3c7; color: #b45309; }
    .status-PAGO { background: #dcfce7; color: #15803d; }
    .status-ENTREGUE { background: #dbeafe; color: #1d4ed8; }
    .status-CANCELADO { background: #fee2e2; color: #b91c1c; }
    .order-items { margin: 10px 0; padding-left: 18px; color: #334155; font-size: 14px; line-height: 1.6; }
    .order-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; padding-top: 12px; border-top: 1px solid #f1f5f9; }
    .status-select { padding: 8px 12px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 13px; }
    .filter-bar { background: white; padding: 16px 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 16px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; }
    .brand-filters { display: flex; flex-wrap: wrap; gap: 8px; }
    .brand-btn { padding: 8px 16px; border: 1px solid #cbd5e1; border-radius: 20px; background: #f8fafc; color: #475569; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .brand-btn:hover { background: #e2e8f0; }
    .brand-btn.active { background: #4f46e5; color: white; border-color: #4f46e5; }
    .search-box { display: flex; align-items: center; gap: 10px; }
    .search-input { padding: 8px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 13px; width: 250px; }
    .count-label { font-size: 13px; color: #64748b; font-weight: 600; }
    table { width: 100%; border-collapse: collapse; background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    th, td { padding: 14px 16px; text-align: left; border-bottom: 1px solid #e2e8f0; font-size: 14px; vertical-align: middle; }
    th { background: #f8fafc; font-weight: bold; color: #475569; }
    .stock-input { width: 70px; padding: 6px; border: 1px solid #cbd5e1; border-radius: 4px; text-align: center; }
    .btn-save { background: #16a34a; color: white; border: none; padding: 7px 14px; border-radius: 4px; font-weight: bold; cursor: pointer; margin-left: 6px; }
    .btn-save:hover { background: #15803d; }
    .photo-cell { display: flex; align-items: center; gap: 10px; }
    .thumb-img { width: 44px; height: 44px; object-fit: cover; border-radius: 6px; border: 1px solid #cbd5e1; background: #f8fafc; }
    .btn-photo { background: #4f46e5; color: white; border: none; padding: 7px 12px; border-radius: 4px; font-weight: bold; font-size: 12px; cursor: pointer; }
    .btn-photo:hover { background: #4338ca; }
  </style>
</head>
<body>
  <header>
    <h1>Painel Administrativo - Kezam Store</h1>
    <div class="nav-links">
      <a href="loja.html" target="_blank">Abrir Vitrine</a>
      <a href="index.html" target="_blank">Importar Planilha</a>
    </div>
  </header>

  <div class="container">
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('orders', this)">Pedidos Recebidos</button>
      <button class="tab-btn" onclick="switchTab('stock', this)">Gestão de Estoque</button>
    </div>

    <!-- Aba Pedidos -->
    <div id="ordersSection" class="section active">
      <div id="ordersList">A carregar pedidos...</div>
    </div>

    <!-- Aba Estoque -->
    <div id="stockSection" class="section">
      <div class="filter-bar">
        <div class="brand-filters">
          <button class="brand-btn active" onclick="setBrandFilter('TODAS', this)">Todas</button>
          <button class="brand-btn" onclick="setBrandFilter('NATURA', this)">Natura</button>
          <button class="brand-btn" onclick="setBrandFilter('AVON', this)">Avon</button>
          <button class="brand-btn" onclick="setBrandFilter('BOTICARIO', this)">O Boticário</button>
          <button class="brand-btn" onclick="setBrandFilter('EUDORA', this)">Eudora</button>
          <button class="brand-btn" onclick="setBrandFilter('OUTRAS', this)">Outras</button>
        </div>
        <div class="search-box">
          <input type="text" id="searchProduct" class="search-input" placeholder="Buscar por nome ou SKU..." oninput="renderStockTable()" />
          <span id="productCount" class="count-label"></span>
        </div>
      </div>

      <table>
        <thead>
          <tr>
            <th>Foto</th>
            <th>SKU</th>
            <th>Produto</th>
            <th>Preço</th>
            <th>Estoque Atual</th>
            <th>Repor / Ajustar (+/-)</th>
          </tr>
        </thead>
        <tbody id="stockTableBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    const API_URL = 'http://127.0.0.1:4000/products';
    let allProducts = [];
    let selectedBrand = 'TODAS';

    function switchTab(tab, btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(tab === 'orders' ? 'ordersSection' : 'stockSection').classList.add('active');
    }

    function normalizeText(text) {
      return (text || '')
        .toString()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toUpperCase();
    }

    function detectBrand(product) {
      const source = normalizeText(
        `${product.brand || ''} ${product.marca || ''} ${product.product_name || ''} ${product.image_url || product.image || ''}`
      );

      if (source.includes('NATURA') || source.includes('UNA') || source.includes('FACES') || source.includes('ESSENCIAL') || source.includes('ILIA') || source.includes('KAIAK') || source.includes('EKOS') || source.includes('TODODIA') || source.includes('CHRONOS')) {
        return 'NATURA';
      }
      if (source.includes('AVON') || source.includes('COLOR TREND') || source.includes('RENEW') || source.includes('FAR AWAY')) {
        return 'AVON';
      }
      if (source.includes('BOTICARIO') || source.includes('MALBEC') || source.includes('LILY') || source.includes('EGEO') || source.includes('FLORATTA') || source.includes('GLAMOUR') || source.includes('COFFEE') || source.includes('QUASAR') || source.includes('NATIVA SPA') || source.includes('CUIDE-SE BEM')) {
        return 'BOTICARIO';
      }
      if (source.includes('EUDORA') || source.includes('SIAGE') || source.includes('NIINA') || source.includes('AURA')) {
        return 'EUDORA';
      }
      return 'OUTRAS';
    }

    function setBrandFilter(brand, btn) {
      selectedBrand = brand;
      document.querySelectorAll('.brand-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderStockTable();
    }

    async function loadOrders() {
      try {
        const res = await fetch(`${API_URL}/orders`);
        const orders = await res.json();
        const container = document.getElementById('ordersList');

        if (!orders || orders.length === 0) {
          container.innerHTML = '<div class="card">Nenhum pedido registado até o momento.</div>';
          return;
        }

        container.innerHTML = orders.map(o => {
          const dateStr = new Date(o.created_at).toLocaleString('pt-BR');
          const totalStr = Number(o.total_amount).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
          const customerName = o.tbl_customers?.full_name || 'Cliente';
          const customerPhone = o.tbl_customers?.phone || '-';

          const itemsHtml = (o.tbl_order_items || []).map(item => `
            <li>${item.quantity}x <strong>${item.tbl_products?.product_name || 'Produto'}</strong> (SKU: ${item.tbl_products?.sku || '-'}) — ${Number(item.subtotal).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })}</li>
          `).join('');

          return `
            <div class="card">
              <div class="order-header">
                <div>
                  <span class="order-id">#${o.order_number}</span>
                  <span style="margin-left: 12px; font-size: 13px; color: #64748b;">${dateStr}</span>
                </div>
                <span class="status-badge status-${o.status}">${o.status}</span>
              </div>
              <div style="font-size: 14px; margin-bottom: 6px;">
                <strong>Cliente:</strong> ${customerName} | <strong>WhatsApp:</strong> ${customerPhone}
              </div>
              <div style="font-size: 13px; color: #334155; background: #f8fafc; padding: 8px 12px; border-radius: 8px; border: 1px solid #e2e8f0; margin-bottom: 10px;">
                <strong>📍 Entrega:</strong> ${o.customer_address || 'Endereço não informado'}
              </div>
              <ul class="order-items">${itemsHtml}</ul>
              <div class="order-footer">
                <div style="font-size: 16px; font-weight: bold; color: #16a34a;">Total: ${totalStr}</div>
                <div>
                  <label style="font-size: 13px; margin-right: 6px;">Alterar Status:</label>
                  <select class="status-select" onchange="changeStatus(${o.order_id}, this.value)">
                    <option value="PENDENTE" ${o.status === 'PENDENTE' ? 'selected' : ''}>PENDENTE</option>
                    <option value="PAGO" ${o.status === 'PAGO' ? 'selected' : ''}>PAGO</option>
                    <option value="ENTREGUE" ${o.status === 'ENTREGUE' ? 'selected' : ''}>ENTREGUE</option>
                    <option value="CANCELADO" ${o.status === 'CANCELADO' ? 'selected' : ''}>CANCELADO</option>
                  </select>
                </div>
              </div>
            </div>
          `;
        }).join('');
      } catch (err) {
        document.getElementById('ordersList').innerHTML = '<div class="card">Erro ao carregar pedidos do servidor.</div>';
      }
    }

    async function changeStatus(orderId, newStatus) {
      try {
        const res = await fetch(`${API_URL}/orders/${orderId}/status`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: newStatus }),
        });
        const data = await res.json();
        if (data.success) {
          loadOrders();
        } else {
          alert(data.message);
        }
      } catch (err) {
        alert('Erro ao atualizar status.');
      }
    }

    async function loadStock() {
      try {
        const res = await fetch(API_URL);
        allProducts = await res.json();
        renderStockTable();
      } catch (err) {
        console.error(err);
      }
    }

    function renderStockTable() {
      const tbody = document.getElementById('stockTableBody');
      const query = normalizeText(document.getElementById('searchProduct')?.value || '');

      const filtered = allProducts.filter(p => {
        const brandMatch = selectedBrand === 'TODAS' || detectBrand(p) === selectedBrand;
        const textMatch = !query || normalizeText(`${p.product_name} ${p.sku}`).includes(query);
        return brandMatch && textMatch;
      });

      const countEl = document.getElementById('productCount');
      if (countEl) {
        countEl.textContent = `${filtered.length} produto(s)`;
      }

      if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: #64748b; padding: 24px;">Nenhum produto encontrado para este filtro.</td></tr>';
        return;
      }

      tbody.innerHTML = filtered.map(p => {
        const currentQty = p.tbl_stock?.quantity ?? 0;
        const priceStr = Number(p.price).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        const rawImg = p.image_url || p.image || '';
        const imgSrc = rawImg
          ? (rawImg.startsWith('http') || rawImg.startsWith('assets/') ? rawImg : `http://127.0.0.1:4000/${rawImg}`)
          : '';

        return `
          <tr>
            <td>
  <div class="photo-cell">
    ${imgSrc ? `<img src="${imgSrc}" class="thumb-img" alt="Foto" />` : ''}
    <input type="file" id="file_${p.product_id}" accept="image/*" style="display: none;" onchange="selectFileAndSave(${p.product_id}, this)" />
    <button class="btn-photo" onclick="document.getElementById('file_${p.product_id}').click()">Escolher Arquivo</button>
  </div>
</td>
            <td>${p.sku}</td>
            <td><strong>${p.product_name}</strong></td>
            <td>${priceStr}</td>
            <td><strong>${currentQty} un.</strong></td>
            <td>
              <input type="number" id="qty_${p.product_id}" class="stock-input" placeholder="+10" />
              <button class="btn-save" onclick="adjustStock(${p.product_id})">Aplicar</button>
            </td>
          </tr>
        `;
      }).join('');
    }

    async function selectFileAndSave(productId, input) {
  const file = input.files[0];
  if (!file) return;

  // Se o arquivo vier de dentro da pasta assets, tenta preservar o caminho relativo; caso contrário, usa assets/<nome>
  let relativePath = `assets/${file.name}`;
  if (file.webkitRelativePath) {
    relativePath = file.webkitRelativePath;
  }

  // Pergunta rápida apenas para confirmar ou ajustar a subpasta dentro de assets/ (ex: assets/Itens Natura/Batom/...)
  const confirmedPath = prompt(
    'Confirme o caminho da imagem na pasta assets:',
    relativePath
  );
  if (!confirmedPath || !confirmedPath.trim()) {
    input.value = '';
    return;
  }

  const cleanPath = confirmedPath.trim().replace(/\\/g, '/');

  try {
    const res = await fetch(`${API_URL}/${productId}/image`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        imageUrl: cleanPath,
        image: cleanPath,
        image_url: cleanPath,
      }),
    });
    const data = await res.json();

    if (res.ok && (data.success || data.image_url || data.product)) {
      loadStock();
    } else {
      alert(data.message || 'Erro ao salvar caminho da imagem.');
    }
  } catch (err) {
    alert('Erro de conexão ao salvar a imagem.');
  } finally {
    input.value = '';
  }
}

    loadOrders();
    loadStock();
  </script>
</body>
</html>
