<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kezam Store - Vitrine de Produtos</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background: #f4f4f9; color: #1e293b; }
    header { background: #4f46e5; color: white; padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    header h1 { font-size: 24px; }
    .header-actions { display: flex; align-items: center; gap: 20px; }
    .cart-btn { background: #ffffff; color: #4f46e5; border: none; padding: 10px 18px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; display: flex; align-items: center; gap: 8px; }
    .cart-btn:hover { background: #eef2ff; }
    .controls { max-width: 1200px; margin: 24px auto; padding: 0 20px; display: flex; gap: 12px; flex-wrap: wrap; }
    .controls input, .controls select { padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; }
    .controls input { flex: 1; min-width: 220px; }
    .grid { max-width: 1200px; margin: 0 auto 40px; padding: 0 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
    .card { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); display: flex; flex-direction: column; justify-content: space-between; }
    .badge { display: inline-block; font-size: 11px; font-weight: bold; padding: 4px 8px; border-radius: 4px; text-transform: uppercase; margin-bottom: 8px; width: fit-content; }
    .badge.natura { background: #ffedd5; color: #c2410c; }
    .badge.avon { background: #fce7f3; color: #be185d; }
    .card h3 { font-size: 16px; margin-bottom: 6px; color: #0f172a; }
    .sku { font-size: 12px; color: #64748b; margin-bottom: 10px; }
    .desc { font-size: 13px; color: #475569; line-height: 1.4; margin-bottom: 16px; flex-grow: 1; }
    .footer-card { border-top: 1px solid #e2e8f0; padding-top: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .price { font-size: 18px; font-weight: bold; color: #16a34a; }
    .stock { font-size: 12px; color: #64748b; }
    .add-btn { width: 100%; background: #4f46e5; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; transition: background 0.2s; }
    .add-btn:hover { background: #4338ca; }

    /* Gaveta do Carrinho */
    .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 20; }
    .overlay.open { display: block; }
    .drawer { position: fixed; top: 0; right: -420px; width: 100%; max-width: 400px; height: 100%; background: white; z-index: 30; box-shadow: -4px 0 15px rgba(0,0,0,0.15); transition: right 0.3s ease; display: flex; flex-direction: column; }
    .drawer.open { right: 0; }
    .drawer-header { padding: 20px; background: #4f46e5; color: white; display: flex; justify-content: space-between; align-items: center; }
    .close-btn { background: none; border: none; color: white; font-size: 22px; cursor: pointer; }
    .drawer-body { flex: 1; overflow-y: auto; padding: 20px; }
    .cart-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; padding: 12px 0; gap: 10px; }
    .cart-item-info { flex: 1; }
    .cart-item-title { font-size: 14px; font-weight: 600; color: #0f172a; }
    .cart-item-price { font-size: 13px; color: #16a34a; font-weight: bold; }
    .qty-controls { display: flex; align-items: center; gap: 8px; }
    .qty-btn { width: 26px; height: 26px; border: 1px solid #cbd5e1; background: #f8fafc; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .drawer-footer { padding: 20px; border-top: 1px solid #e2e8f0; background: #f8fafc; }
    .total-row { display: flex; justify-content: space-between; font-size: 18px; font-weight: bold; margin-bottom: 16px; }
    .customer-input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; margin-bottom: 10px; font-size: 14px; }
    .checkout-btn { width: 100%; background: #16a34a; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; font-size: 15px; cursor: pointer; }
    .checkout-btn:hover { background: #15803d; }
  </style>
</head>
<body>
  <header>
    <h1>✨ Kezam Store</h1>
    <div class="header-actions">
      <span id="counter">A carregar catálogo...</span>
      <button class="cart-btn" onclick="toggleCart()">
        🛒 Carrinho (<span id="cartCount">0</span>)
      </button>
    </div>
  </header>

  <div class="controls">
    <input type="text" id="searchInput" placeholder="Buscar por nome ou código SKU..." oninput="filterProducts()" />
    <select id="brandFilter" onchange="filterProducts()">
      <option value="">Todas as Marcas</option>
      <option value="Natura">Natura</option>
      <option value="Avon">Avon</option>
    </select>
  </div>

  <div class="grid" id="productsGrid"></div>

  <!-- Gaveta Lateral do Carrinho -->
  <div class="overlay" id="overlay" onclick="toggleCart()"></div>
  <div class="drawer" id="cartDrawer">
    <div class="drawer-header">
      <h2>🛒 Seu Carrinho</h2>
      <button class="close-btn" onclick="toggleCart()">&times;</button>
    </div>
    <div class="drawer-body" id="cartItemsContainer"></div>
    <div class="drawer-footer">
      <div class="total-row">
        <span>Total:</span>
        <span id="cartTotal">R$ 0,00</span>
      </div>
      <input type="text" id="customerName" class="customer-input" placeholder="Seu nome completo" />
      <input type="text" id="customerPhone" class="customer-input" placeholder="Seu WhatsApp / Telefone" />
      <select id="storeWhatsapp" class="customer-input">
        <option value="5581997422792">Enviar para WhatsApp 1 (81 99742-2792)</option>
        <option value="5511995449855">Enviar para WhatsApp 2 (11 99544-9855)</option>
      </select>
      <button class="checkout-btn" onclick="checkout()">Finalizar Pedido</button>
    </div>
  </div>

  <script>
    let allProducts = [];
    let cart = [];

    function getProductBrand(p) {
      if (p.tbl_brands?.brand_name) return p.tbl_brands.brand_name;
      const text = `${p.product_name || ''} ${p.description || ''}`.toUpperCase();
      return text.includes('AVON') ? 'Avon' : 'Natura';
    }

    async function loadProducts() {
      try {
        const res = await fetch('http://127.0.0.1:4000/products');
        allProducts = await res.json();
        filterProducts();
      } catch (err) {
        document.getElementById('counter').textContent = 'Erro ao carregar produtos do servidor.';
      }
    }

    function renderProducts(list) {
      const grid = document.getElementById('productsGrid');
      const counter = document.getElementById('counter');
      counter.textContent = `${list.length} produto(s) disponível(is)`;

      grid.innerHTML = list.map(p => {
        const brand = getProductBrand(p);
        const brandClass = brand.toLowerCase() === 'avon' ? 'avon' : 'natura';
        const stock = p.tbl_stock?.quantity ?? 0;
        const priceFormatted = Number(p.price).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

        return `
          <div class="card">
            <div>
              <span class="badge ${brandClass}">${brand}</span>
              <h3>${p.product_name}</h3>
              <div class="sku">Cód. SKU: ${p.sku}</div>
              <p class="desc">${p.description || ''}</p>
            </div>
            <div>
              <div class="footer-card">
                <span class="price">${priceFormatted}</span>
                <span class="stock">Estoque: ${stock} un.</span>
              </div>
              <button class="add-btn" onclick="addToCart(${p.product_id})">+ Adicionar ao Carrinho</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function filterProducts() {
      const term = document.getElementById('searchInput').value.toLowerCase();
      const brand = document.getElementById('brandFilter').value;

      const filtered = allProducts.filter(p => {
        const matchesText = p.product_name.toLowerCase().includes(term) || String(p.sku).includes(term);
        const productBrand = getProductBrand(p);
        const matchesBrand = !brand || (productBrand.toLowerCase() === brand.toLowerCase());
        return matchesText && matchesBrand;
      });

      renderProducts(filtered);
    }

    function toggleCart() {
      document.getElementById('overlay').classList.toggle('open');
      document.getElementById('cartDrawer').classList.toggle('open');
    }

    function addToCart(productId) {
      const product = allProducts.find(p => p.product_id === productId);
      if (!product) return;

      const existing = cart.find(item => item.product_id === productId);
      if (existing) {
        existing.quantity += 1;
      } else {
        cart.push({
          product_id: product.product_id,
          sku: product.sku,
          product_name: product.product_name,
          price: Number(product.price),
          quantity: 1,
        });
      }
      updateCartUI();
    }

    function changeQty(productId, delta) {
      const index = cart.findIndex(item => item.product_id === productId);
      if (index === -1) return;

      cart[index].quantity += delta;
      if (cart[index].quantity <= 0) {
        cart.splice(index, 1);
      }
      updateCartUI();
    }

    function updateCartUI() {
      const container = document.getElementById('cartItemsContainer');
      const countEl = document.getElementById('cartCount');
      const totalEl = document.getElementById('cartTotal');

      const totalItems = cart.reduce((acc, item) => acc + item.quantity, 0);
      const totalValue = cart.reduce((acc, item) => acc + (item.price * item.quantity), 0);

      countEl.textContent = totalItems;
      totalEl.textContent = totalValue.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

      if (cart.length === 0) {
        container.innerHTML = '<p style="color:#64748b; text-align:center; margin-top:40px;">O seu carrinho está vazio.</p>';
        return;
      }

      container.innerHTML = cart.map(item => `
        <div class="cart-item">
          <div class="cart-item-info">
            <div class="cart-item-title">${item.product_name}</div>
            <div class="cart-item-price">${(item.price * item.quantity).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })}</div>
          </div>
          <div class="qty-controls">
            <button class="qty-btn" onclick="changeQty(${item.product_id}, -1)">-</button>
            <span>${item.quantity}</span>
            <button class="qty-btn" onclick="changeQty(${item.product_id}, 1)">+</button>
          </div>
        </div>
      `).join('');
    }

    async function checkout() {
      if (cart.length === 0) {
        alert('Adicione pelo menos um produto ao carrinho!');
        return;
      }

      const customerName = document.getElementById('customerName').value.trim();
      const customerPhone = document.getElementById('customerPhone').value.trim();
      const selectedWhatsapp = document.getElementById('storeWhatsapp').value;

      if (!customerName || !customerPhone) {
        alert('Por favor, preencha o seu nome e telefone/WhatsApp.');
        return;
      }

      try {
        const res = await fetch('http://127.0.0.1:4000/products/checkout', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            customerName,
            customerPhone,
            items: cart,
          }),
        });

        const result = await res.json();
        if (result.success) {
          const totalValue = cart.reduce((acc, item) => acc + item.price * item.quantity, 0);
          const totalFormatted = totalValue.toLocaleString('pt-BR', {
            style: 'currency',
            currency: 'BRL',
          });

          const itemsList = cart
            .map(
              (item) =>
                `• ${item.quantity}x ${item.product_name} (Cód. ${item.sku}) - ${(
                  item.price * item.quantity
                ).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })}`,
            )
            .join('\n');

          const message =
            `*NOVO PEDIDO - KEZAM STORE*\n\n` +
            `*Pedido:* #${result.orderNumber}\n` +
            `*Cliente:* ${customerName}\n` +
            `*Contato:* ${customerPhone}\n\n` +
            `*Itens do Pedido:*\n${itemsList}\n\n` +
            `*Total:* ${totalFormatted}`;

          const encodedMessage = encodeURIComponent(message);
          const whatsappUrl = `https://wa.me/${selectedWhatsapp}?text=${encodedMessage}`;

          cart = [];
          updateCartUI();
          toggleCart();
          loadProducts();

          window.open(whatsappUrl, '_blank');
        } else {
          alert(`Erro: ${result.message}`);
        }
      } catch (err) {
        alert('Erro ao comunicar com o servidor para finalizar o pedido.');
      }
    }

    updateCartUI();
    loadProducts();
  </script>
</body>
</html>
