<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Kezam Store - Gestão de Produtos com IA</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #f1f1f1;
            padding: 40px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h2 {
            color: #ff2a85; /* Rosa forte vibrante da identidade visual */
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            border-radius: 6px;
            font-size: 14px;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #ff2a85;
            outline: none;
        }
        button {
            background-color: #ff2a85;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #e02072;
        }
        .btn-ai {
            background-color: #2e7d32; /* Verde elegante */
            margin-top: 8px;
        }
        .btn-ai:hover {
            background-color: #1b5e20;
        }
        textarea {
            resize: vertical;
            height: 120px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>✨ Adicionar Produto & IA</h2>
        <form id="productForm">
            <div class="form-group">
                <label for="name">Nome do Produto:</label>
                <input type="text" id="name" placeholder="Ex: Sérum Facial Glow Vitamina C" required>
            </div>

            <div class="form-group">
                <label for="category">Categoria:</label>
                <input type="text" id="category" placeholder="Ex: Skincare / Cuidados de Pele" required>
            </div>

            <div class="form-group">
                <button type="button" class="btn-ai" id="btnAi">🤖 Gerar Descrição com IA</button>
            </div>

            <div class="form-group">
                <label for="description">Descrição:</label>
                <textarea id="description" placeholder="A descrição gerada pela IA aparecerá aqui automaticamente..."></textarea>
            </div>

            <button type="submit">Guardar Produto</button>
        </form>
    </div>

    <script>
        const btnAi = document.getElementById('btnAi');
        const nameInput = document.getElementById('name');
        const categoryInput = document.getElementById('category');
        const descriptionTextarea = document.getElementById('description');

        btnAi.addEventListener('click', async () => {
            const name = nameInput.value.trim();
            const category = categoryInput.value.trim();

            if (!name || !category) {
                alert('Por favor, preencha o Nome e a Categoria antes de gerar a descrição com IA!');
                return;
            }

            btnAi.innerText = 'A gerar descrição com IA... ✨';
            btnAi.disabled = true;

            try {
                const response = await fetch('http://127.0.0.1:4000/products/ai-description', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name, category })
                });

                const data = await response.json();

                if (response.ok) {
                    descriptionTextarea.value = data.description;
                } else {
                    alert('Erro ao gerar descrição.');
                }
            } catch (error) {
                console.error('Erro de conexão:', error);
                alert('Não foi possível ligar ao servidor backend na porta 4000.');
            } finally {
                btnAi.innerText = '🤖 Gerar Descrição com IA';
                btnAi.disabled = false;
            }
        });
    </script>

</body>
</html>
